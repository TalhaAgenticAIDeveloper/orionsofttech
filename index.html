<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#059669" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Primary Favicons & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Default Meta Baseline (Hydrated Dynamically by react-helmet-async) -->
    <title>Orion Software &amp; Trading | Complete Technology Solutions</title>
    <meta name="description" content="Orion Software &amp; Trading delivers custom software development, enterprise IT hardware supply, professional installation, and ongoing technical support." />
    <link rel="canonical" href="https://orionsofttechh.vercel.app" />

    <!-- Open Graph Fallback -->
    <meta property="og:site_name" content="Orion Software &amp; Trading" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Orion Software &amp; Trading | Complete Technology Solutions" />
    <meta property="og:description" content="Custom software engineering, enterprise IT hardware supply, and on-site technical support under one roof." />
    <meta property="og:image" content="https://orionsofttechh.vercel.app/images/og/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orion Software &amp; Trading | Complete Technology Solutions" />
    <meta name="twitter:description" content="Custom software engineering, enterprise IT hardware supply, and on-site technical support under one roof." />
    <meta name="twitter:image" content="https://orionsofttechh.vercel.app/images/og/og-default.jpg" />

    <!-- Google Fonts: Plus Jakarta Sans & Inter with display=swap and preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Anti-Flash Theme Initializer -->
    <script>
      (function() {
        var theme = localStorage.getItem('orion-theme-preference');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#0B0F19] text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
